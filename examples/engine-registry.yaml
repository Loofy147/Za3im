# Reference registry only; the runtime does not load this file.
# Candidate agents remain disabled until pinned-commit, license/security review,
# adapter implementation, and conformance tests have evidence.
registry_schema_version: za3im.engine-registry/0.1
runtime_registry_loaded: false
reviewed_date: 2026-10-10

engines:
  openai-responses:
    status: implemented_unit_tested_live_provider_not_verified
    executable_path: za3im_runtime/provider.py
    capability: provider.openai.responses
    endpoint: https://api.openai.com/v1/responses
    credentials: OPENAI_API_KEY environment variable
    live_smoke_test: not_run

  deer-flow:
    repository: https://github.com/bytedance/deer-flow
    status: candidate_disabled
    required_gates: [pin_commit, verify_license, sandbox_review, adapter, conformance_tests]
  agent-zero:
    repository: https://github.com/agent0ai/agent-zero
    status: candidate_disabled
    required_gates: [pin_commit, verify_license, sandbox_review, adapter, conformance_tests]
  openmanus:
    repository: https://github.com/FoundationAgents/OpenManus
    status: candidate_disabled
    required_gates: [pin_commit, verify_license, sandbox_review, adapter, conformance_tests]
  openhands:
    repository: https://github.com/OpenHands/software-agent-sdk
    status: candidate_disabled
    required_gates: [pin_commit, verify_license, ephemeral_workspace, adapter, conformance_tests]
  browser-use:
    repository: https://github.com/browser-use/browser-use
    status: candidate_disabled
    required_gates: [pin_commit, verify_license, browser_isolation, adapter, conformance_tests]
  skyvern:
    repository: https://github.com/Skyvern-AI/skyvern
    status: candidate_disabled
    required_gates: [pin_commit, legal_license_review, browser_isolation, adapter, conformance_tests]

  m0-durable-run:
    repository: https://github.com/Loofy147/m0-durable-run
    status: reuse_candidate_not_integrated
    finding: main_has_sqlite_durable_core; HTTP_api_is_on_feature_branch; provider_execution_not_live_verified
    required_gates: [choose_stable_revision, run_upstream_tests, integrate_without_duplicate_truth, integration_tests]

infrastructure_candidates:
  litellm:
    repository: https://github.com/BerriAI/litellm
    status: evaluate_not_installed
    decision_gate: compare_with_current_concrete_provider_client_before_adding_gateway
  temporal:
    repository: https://github.com/temporalio/temporal
    status: evaluate_not_installed
    decision_gate: inspect_m0_durable_run_and_prove_need_for_durable_distributed_workflows
  e2b:
    repository: https://github.com/e2b-dev/e2b
    status: evaluate_not_installed
    decision_gate: compare_isolation_cost_and_data_handling_with_current_local_mvp

protocols:
  mcp:
    specification: https://modelcontextprotocol.io/
    status: research_only_not_integrated
  a2a:
    specification: https://a2a-protocol.org/
    status: research_only_not_integrated

observability:
  opentelemetry:
    specification: https://opentelemetry.io/docs/
    status: not_integrated
